
<!DOCTYPE html>
<html>
<head>
    <title>My Cute Cat World</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-family: Arial;
            background: linear-gradient(135deg, #ffd6e7, #d9c8ff);
            overflow: hidden;
        }

        h1 {
            color: #743c75;
        }

        .cat {
            font-size: 110px;
            animation: bounce 1s infinite alternate;
            cursor: pointer;
        }

        @keyframes bounce {
            from {
                transform: translateY(0);
            }
            to {
                transform: translateY(-35px);
            }
        }

        .walking {
            animation: walk 4s infinite alternate ease-in-out;
        }

        @keyframes walk {
            from {
                transform: translateX(-150px) rotate(-10deg);
            }
            to {
                transform: translateX(150px) rotate(10deg);
            }
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            background: #a85ca8;
            color: white;
            font-size: 17px;
            cursor: pointer;
            margin: 10px;
        }

        button:hover {
            background: #743c75;
        }

        .heart {
            position: absolute;
            font-size: 25px;
            animation: float 5s linear infinite;
        }

        @keyframes float {
            from {
                transform: translateY(100vh);
                opacity: 1;
            }
            to {
                transform: translateY(-100px);
                opacity: 0;
            }
        }

        #message {
            color: #743c75;
            font-size: 20px;
            margin: 15px;
        }
    </style>
</head>

<body>

    <h1>Welcome to My Cat World! 🐾</h1>

    <div class="cat" id="cat">🐱</div>

    <p id="message">Hello! I'm your little dancing cat 💗</p>

    <button onclick="danceCat()">Make Me Dance!</button>

    <button onclick="changeBackground()">Change Background</button>

    <button onclick="changeCat()">Change Cat</button>

    <script>

        let cat = document.getElementById("cat");

        function danceCat() {
            cat.classList.toggle("walking");
            document.getElementById("message").innerHTML =
            "Yayyy! Look at me dance! 💃🐱";
        }

        function changeBackground() {
            let colors = [
                "linear-gradient(135deg, #ffb6c1, #dda0dd)",
                "linear-gradient(135deg, #b5ead7, #c7ceea)",
                "linear-gradient(135deg, #ffe5b4, #ffb6c1)",
                "linear-gradient(135deg, #c9b6ff, #a0e7e5)"
            ];

            document.body.style.background =
            colors[Math.floor(Math.random() * colors.length)];
        }

        function changeCat() {
            let cats = ["🐱", "😺", "😸", "😻", "🙀"];
            cat.innerHTML = cats[Math.floor(Math.random() * cats.length)];
        }

        function createHeart() {
            let heart = document.createElement("div");

            heart.className = "heart";
            heart.innerHTML = "💗";
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = (3 + Math.random() * 4) + "s";

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 7000);
        }

        setInterval(createHeart, 500);

    </script>

</body>
</html>
